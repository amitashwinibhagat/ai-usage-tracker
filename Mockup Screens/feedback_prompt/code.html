<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Feedback Prompt</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#ffb595",
                        "secondary-container": "#7508a5",
                        "on-secondary-container": "#e19fff",
                        "on-primary-fixed-variant": "#004493",
                        "secondary-fixed-dim": "#e8b3ff",
                        "error": "#ffb4ab",
                        "background": "#10131b",
                        "surface-variant": "#31353d",
                        "surface-tint": "#adc6ff",
                        "surface-bright": "#363942",
                        "on-secondary-fixed-variant": "#7201a2",
                        "on-tertiary-fixed": "#351000",
                        "primary-container": "#4b8eff",
                        "on-tertiary": "#571e00",
                        "inverse-surface": "#e0e2ed",
                        "secondary-fixed": "#f6d9ff",
                        "surface-dim": "#10131b",
                        "surface-container": "#1c2028",
                        "primary-fixed": "#d8e2ff",
                        "error-container": "#93000a",
                        "inverse-primary": "#005bc1",
                        "on-surface": "#e0e2ed",
                        "on-primary": "#002e69",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2d3039",
                        "on-tertiary-container": "#4c1a00",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-container-high": "#272a32",
                        "outline": "#8b90a0",
                        "tertiary-fixed": "#ffdbcc",
                        "tertiary-container": "#ef6719",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "on-primary-fixed": "#001a41",
                        "surface-container-highest": "#31353d",
                        "outline-variant": "#414755",
                        "on-secondary-fixed": "#310048",
                        "surface": "#10131b",
                        "secondary": "#e8b3ff",
                        "surface-container-lowest": "#0b0e16",
                        "on-primary-container": "#00285c",
                        "on-error": "#690005",
                        "tertiary-fixed-dim": "#ffb595",
                        "on-background": "#e0e2ed",
                        "surface-container-low": "#181c23",
                        "on-surface-variant": "#c1c6d7",
                        "primary": "#adc6ff",
                        "on-secondary": "#510074"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xxs": "4px",
                        "xl": "32px",
                        "margin": "16px",
                        "md": "16px",
                        "xs": "8px",
                        "sm": "12px",
                        "gutter": "12px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "section-header": ["Inter"],
                        "key-mono": ["JetBrains Mono"],
                        "body": ["Inter"],
                        "page-title": ["Inter"],
                        "caption": ["Inter"],
                        "body-semibold": ["Inter"]
                    },
                    "fontSize": {
                        "section-header": ["13px", { "lineHeight": "18px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "key-mono": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body": ["13px", { "lineHeight": "18px", "letterSpacing": "-0.005em", "fontWeight": "400" }],
                        "page-title": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.015em", "fontWeight": "600" }],
                        "caption": ["11px", { "lineHeight": "14px", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "body-semibold": ["13px", { "lineHeight": "18px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .backdrop-blur-custom {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="w-[380px] bg-surface-container/80 backdrop-blur-custom rounded-xl border border-outline-variant shadow-2xl flex flex-col overflow-hidden">
<!-- Header -->
<div class="px-md py-sm flex flex-col items-center border-b border-outline-variant/50 pt-lg pb-md bg-surface-container-low/50">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center mb-sm border border-primary-container/30">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">rate_review</span>
</div>
<h2 class="font-page-title text-page-title text-on-surface mb-xxs text-center">Help Us Improve</h2>
<p class="font-body text-body text-on-surface-variant text-center px-sm">Your feedback is crucial for shaping the future of Claude Tracker Pro.</p>
</div>
<!-- Form Content -->
<div class="p-md flex flex-col gap-sm">
<!-- Name & Role Row -->
<div class="flex gap-sm">
<div class="flex-1 flex flex-col gap-xxs">
<label class="font-caption text-caption text-on-surface-variant">Name</label>
<input class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-xs py-xxs font-body text-body text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary placeholder-on-surface-variant/50 transition-shadow" placeholder="Jane Doe" type="text"/>
</div>
<div class="flex-1 flex flex-col gap-xxs">
<label class="font-caption text-caption text-on-surface-variant">Role</label>
<select class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-xs py-xxs font-body text-body text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow appearance-none">
<option>Developer</option>
<option>Designer</option>
<option>Product Manager</option>
<option>Other</option>
</select>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-xxs">
<label class="font-caption text-caption text-on-surface-variant">Email Address</label>
<input class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-xs py-xxs font-body text-body text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary placeholder-on-surface-variant/50 transition-shadow" placeholder="jane@example.com" type="email"/>
</div>
<!-- Message -->
<div class="flex flex-col gap-xxs">
<label class="font-caption text-caption text-on-surface-variant flex justify-between">
<span>Message</span>
<span class="opacity-50">Max 500 chars</span>
</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-xs py-xs font-body text-body text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary resize-none placeholder-on-surface-variant/50 transition-shadow" placeholder="What do you love? What could be better?" rows="4"></textarea>
</div>
<!-- Satisfaction Rating -->
<div class="flex flex-col gap-xxs pt-xs">
<label class="font-caption text-caption text-on-surface-variant text-center mb-xxs">Overall Satisfaction</label>
<div class="flex justify-between items-center px-lg">
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-surface-variant text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-xl">sentiment_dissatisfied</span>
</button>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-surface-variant text-on-surface-variant hover:text-tertiary transition-colors">
<span class="material-symbols-outlined text-xl">sentiment_neutral</span>
</button>
<button class="w-8 h-8 rounded-full flex items-center justify-center bg-primary-container/20 text-primary border border-primary/30">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">sentiment_satisfied</span>
</button>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-md pt-0 flex flex-col gap-xs mt-sm">
<button class="w-full bg-primary-container hover:bg-primary text-on-primary-container font-body-semibold text-body-semibold py-xs rounded-DEFAULT transition-colors flex items-center justify-center gap-xs">
<span>Submit Feedback</span>
<span class="material-symbols-outlined text-[16px]">send</span>
</button>
<div class="flex justify-between items-center mt-xs">
<button class="font-caption text-caption text-on-surface-variant hover:text-on-surface transition-colors border-b border-transparent hover:border-on-surface pb-[1px]">
                    Don't ask again
                </button>
<button class="font-caption text-caption text-on-surface-variant hover:text-on-surface transition-colors">
                    Remind me later
                </button>
</div>
</div>
</div>
</body></html>
