<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Monitor - GitHub Star Prompt</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#10131b",
                        "surface-container-high": "#272a32",
                        "on-primary-fixed-variant": "#004493",
                        "surface-container": "#1c2028",
                        "surface-variant": "#31353d",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#31353d",
                        "outline-variant": "#414755",
                        "error": "#ffb4ab",
                        "surface-container-lowest": "#0b0e16",
                        "on-surface-variant": "#c1c6d7",
                        "error-container": "#93000a",
                        "background": "#10131b",
                        "surface-bright": "#363942",
                        "surface-tint": "#adc6ff",
                        "surface-container-low": "#181c23",
                        "on-tertiary": "#571e00",
                        "primary-fixed-dim": "#adc6ff",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "secondary-fixed-dim": "#e8b3ff",
                        "on-secondary-fixed": "#310048",
                        "on-tertiary-fixed": "#351000",
                        "on-tertiary-container": "#4c1a00",
                        "tertiary": "#ffb595",
                        "secondary-container": "#7508a5",
                        "tertiary-fixed-dim": "#ffb595",
                        "on-surface": "#e0e2ed",
                        "inverse-surface": "#e0e2ed",
                        "on-secondary-fixed-variant": "#7201a2",
                        "inverse-primary": "#005bc1",
                        "secondary": "#e8b3ff",
                        "on-background": "#e0e2ed",
                        "primary-container": "#4b8eff",
                        "outline": "#8b90a0",
                        "on-error": "#690005",
                        "tertiary-fixed": "#ffdbcc",
                        "secondary-fixed": "#f6d9ff",
                        "on-primary-fixed": "#001a41",
                        "tertiary-container": "#ef6719",
                        "on-primary": "#002e69",
                        "primary-fixed": "#d8e2ff",
                        "primary": "#adc6ff",
                        "on-primary-container": "#00285c",
                        "surface-dim": "#10131b",
                        "on-secondary-container": "#e19fff",
                        "on-secondary": "#510074",
                        "inverse-on-surface": "#2d3039"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "lg": "24px",
                        "xxs": "4px",
                        "md": "16px",
                        "gutter": "12px",
                        "xl": "32px",
                        "margin": "16px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "key-mono": ["JetBrains Mono"],
                        "body-semibold": ["Inter"],
                        "body": ["Inter"],
                        "section-header": ["Inter"],
                        "caption": ["Inter"],
                        "page-title": ["Inter"]
                    },
                    "fontSize": {
                        "key-mono": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "body-semibold": ["13px", {"lineHeight": "18px", "fontWeight": "600"}],
                        "body": ["13px", {"lineHeight": "18px", "letterSpacing": "-0.005em", "fontWeight": "400"}],
                        "section-header": ["13px", {"lineHeight": "18px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "caption": ["11px", {"lineHeight": "14px", "letterSpacing": "0.01em", "fontWeight": "400"}],
                        "page-title": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.015em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: transparent; /* For rendering as a standalone window/modal */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .mac-window-shadow {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
    </style>
</head>
<body class="bg-background/80 backdrop-blur-sm p-lg">
<!-- Modal Window Container -->
<div class="bg-surface w-full max-w-[400px] rounded-xl border border-outline-variant overflow-hidden mac-window-shadow flex flex-col">
<!-- Mac-style Traffic Lights & Header (Optional/Decorative for standalone utility feel) -->
<div class="h-8 bg-surface-container-high border-b border-outline-variant flex items-center px-sm gap-2">
<div class="w-3 h-3 rounded-full bg-outline-variant/50 hover:bg-[#FF5F56] transition-colors cursor-pointer"></div>
<div class="w-3 h-3 rounded-full bg-outline-variant/50 hover:bg-[#FFBD2E] transition-colors cursor-pointer"></div>
<div class="w-3 h-3 rounded-full bg-outline-variant/50 hover:bg-[#27C93F] transition-colors cursor-pointer"></div>
<div class="flex-1 text-center font-caption text-caption text-on-surface-variant mr-11">AI Monitor</div>
</div>
<!-- Content Canvas -->
<div class="p-xl flex flex-col items-center text-center space-y-lg relative overflow-hidden">
<!-- Subtle background glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-primary/10 rounded-full blur-3xl -z-10"></div>
<!-- GitHub Logo / Icon -->
<div class="w-16 h-16 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[32px] text-on-surface" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<!-- Text Content -->
<div class="space-y-sm">
<h2 class="font-page-title text-page-title text-on-surface tracking-tight">Enjoying AI Monitor?</h2>
<p class="font-body text-body text-on-surface-variant max-w-[280px] mx-auto">
                    If you find this utility helpful in your daily workflow, consider giving it a star on GitHub. It helps the project grow.
                </p>
</div>
<!-- Actions -->
<div class="w-full space-y-sm pt-xs">
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-body-semibold text-body-semibold py-xs px-md rounded-lg hover:bg-primary transition-colors flex items-center justify-center gap-xs shadow-sm group">
<span class="material-symbols-outlined text-[18px] group-hover:scale-110 transition-transform" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
                    Star on GitHub
                </button>
<!-- Secondary Actions -->
<div class="flex flex-col gap-xxs pt-xs">
<button class="font-body text-body text-on-surface-variant hover:text-on-surface py-xs transition-colors rounded-md hover:bg-surface-variant/50">
                        Remind me later
                    </button>
<button class="font-caption text-caption text-outline hover:text-on-surface-variant transition-colors py-xs">
                        Don't ask again
                    </button>
</div>
</div>
</div>
</div>
</body></html>
